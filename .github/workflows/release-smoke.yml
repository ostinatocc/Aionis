name: Release Smoke

on:
  workflow_dispatch:
    inputs:
      aionis_cli_spec:
        description: "Published top-level CLI npm spec to verify"
        required: false
        default: "aionis@latest"

permissions:
  contents: read

jobs:
  published-cli:
    name: Published CLI operator smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run published CLI operator smoke
        run: npm run -s runtime:smoke:published-cli
        env:
          AIONIS_PUBLISHED_CLI_SMOKE_SPEC: ${{ inputs.aionis_cli_spec }}
