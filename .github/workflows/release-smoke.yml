name: Release Smoke

on:
  workflow_dispatch:
    inputs:
      aionis_cli_spec:
        description: "Published top-level CLI npm spec to verify"
        required: false
        default: "aionis@latest"

permissions:
  contents: read

jobs:
  published-cli:
    name: Published CLI operator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run published CLI operator smoke
        run: npm run -s runtime:smoke:published-cli
        env:
          AIONIS_PUBLISHED_CLI_SMOKE_SPEC: ${{ inputs.aionis_cli_spec }}
