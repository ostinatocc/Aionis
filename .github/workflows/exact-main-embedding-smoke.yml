name: Exact Main Embedding Smoke
run-name: Exact Main Embedding Smoke ${{ inputs.expected_sha }} ${{ inputs.evidence_id }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact origin/main commit to verify with the protected embedding provider
        required: true
        type: string
      evidence_id:
        description: Unique release evidence identifier used to bind this dispatch to its run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: exact-main-embedding-smoke-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  exact-main-embedding-smoke:
    name: Exact main Qwen embedding smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: exact-main-embedding
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_ID: ${{ inputs.evidence_id }}
    steps:
      - name: Checkout expected Runtime commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact origin/main commit
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a lowercase 40-character commit" >&2
            exit 1
          fi
          evidence_pattern="^(candidate|stable)-${EXPECTED_SHA}-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{16}$"
          if [[ ! "${EVIDENCE_ID}" =~ ${evidence_pattern} ]]; then
            echo "evidence_id must match <candidate|stable>-${EXPECTED_SHA}-YYYYMMDDTHHMMSSZ-<16 lowercase hex>" >&2
            exit 1
          fi
          actual_commit="$(git rev-parse 'HEAD^{commit}')"
          dispatch_commit="${GITHUB_SHA}"
          dispatch_ref="${GITHUB_REF}"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          test "${actual_commit}" = "${EXPECTED_SHA}"
          test "${dispatch_commit}" = "${EXPECTED_SHA}"
          test "${dispatch_ref}" = "refs/heads/main"
          test "${main_commit}" = "${EXPECTED_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Read frozen package coordinates
        id: package-coordinates
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const train = JSON.parse(fs.readFileSync("release-train.json", "utf8"));
          if (!["candidate", "stable"].includes(train.status)) {
            throw new Error(`exact-main embedding release evidence requires candidate or stable status; got ${train.status}`);
          }
          const expectedEvidenceId = new RegExp(`^${train.status}-${process.env.EXPECTED_SHA}-\\d{8}T\\d{6}Z-[0-9a-f]{16}$`);
          if (!expectedEvidenceId.test(process.env.EVIDENCE_ID)) throw new Error("evidence_id does not match the checked-out release status");
          for (const key of ["sdk", "mcp", "create"]) {
            const artifact = train.packages?.[key];
            if (!artifact || typeof artifact.source_ref !== "string" || !artifact.source_ref.trim()) {
              throw new Error(`release-train.packages.${key}.source_ref is required`);
            }
            if (typeof artifact.source_commit !== "string" || !/^[0-9a-f]{40}$/.test(artifact.source_commit)) {
              throw new Error(`release-train.packages.${key}.source_commit must be a lowercase commit`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}_ref=${artifact.source_ref}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}_commit=${artifact.source_commit}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}_version=${artifact.version}\n`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `runtime_version=${train.runtime.version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `runtime_tag=${train.runtime.source_tag}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_status=${train.status}\n`);
          NODE

      - name: Checkout frozen SDK
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ostinatocc/aionis-sdk
          ref: ${{ steps.package-coordinates.outputs.sdk_ref }}
          path: external/aionis-sdk
          persist-credentials: false

      - name: Checkout frozen MCP
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ostinatocc/aionis-mcp
          ref: ${{ steps.package-coordinates.outputs.mcp_ref }}
          path: external/aionis-mcp
          persist-credentials: false

      - name: Checkout frozen installer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ostinatocc/aionis-create
          ref: ${{ steps.package-coordinates.outputs.create_ref }}
          path: external/aionis-create
          persist-credentials: false

      - name: Verify frozen package commits
        env:
          EXPECTED_SDK_COMMIT: ${{ steps.package-coordinates.outputs.sdk_commit }}
          EXPECTED_MCP_COMMIT: ${{ steps.package-coordinates.outputs.mcp_commit }}
          EXPECTED_CREATE_COMMIT: ${{ steps.package-coordinates.outputs.create_commit }}
        run: |
          set -euo pipefail
          sdk_commit="$(git -C external/aionis-sdk rev-parse 'HEAD^{commit}')"
          mcp_commit="$(git -C external/aionis-mcp rev-parse 'HEAD^{commit}')"
          create_commit="$(git -C external/aionis-create rev-parse 'HEAD^{commit}')"
          test "${sdk_commit}" = "${EXPECTED_SDK_COMMIT}"
          test "${mcp_commit}" = "${EXPECTED_MCP_COMMIT}"
          test "${create_commit}" = "${EXPECTED_CREATE_COMMIT}"
          test -z "$(git -C external/aionis-sdk status --porcelain)"
          test -z "$(git -C external/aionis-mcp status --porcelain)"
          test -z "$(git -C external/aionis-create status --porcelain)"

      - name: Install Runtime dependencies
        run: npm ci

      - name: Pack exact SDK, MCP, and installer artifacts
        id: package-artifacts
        env:
          PACK_DIR: ${{ runner.temp }}/aionis-exact-main-packages
        run: |
          set -euo pipefail
          mkdir -p "${PACK_DIR}"
          pack_exact() {
            local output_name="$1"
            local package_dir="$2"
            (
              cd "${package_dir}"
              npm ci --ignore-scripts
            )
            local filename
            filename="$(
              cd "${package_dir}"
              AIONIS_RUNTIME_REPO="${GITHUB_WORKSPACE}" \
                npm pack --silent --pack-destination "${PACK_DIR}" | tail -n 1
            )"
            filename="$(basename "${filename}")"
            test -n "${filename}"
            test -f "${PACK_DIR}/${filename}"
            printf '%s_spec=%s/%s\n' "${output_name}" "${PACK_DIR}" "${filename}" >> "${GITHUB_OUTPUT}"
          }
          pack_exact sdk "${GITHUB_WORKSPACE}/external/aionis-sdk"
          pack_exact mcp "${GITHUB_WORKSPACE}/external/aionis-mcp"
          pack_exact create "${GITHUB_WORKSPACE}/external/aionis-create"

      - name: Run protected Qwen external-package smoke
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DOTENV_CONFIG_PATH: /dev/null
          EMBEDDING_PROVIDER: dashscope
          AIONIS_AGENT_E2E_EMBEDDING_PROVIDER: dashscope
          DASHSCOPE_EMBED_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
          DASHSCOPE_EMBEDDING_MODEL: qwen3.7-text-embedding
          DASHSCOPE_EMBED_BATCH_SIZE: "10"
          EMBEDDING_DIM: "1536"
          EMBEDDING_ENABLED_SURFACES_JSON: '["write_auto_embed","recall_text","planning_context","context_assemble"]'
          LITE_INLINE_EMBEDDING_TIMEOUT_MS: "60000"
          EMBED_HTTP_TIMEOUT_MS: "15000"
          EMBED_HTTP_MAX_RETRIES: "2"
          AIONIS_MULTI_AGENT_E2E_BASE_URL: ""
          AIONIS_PRODUCT_E2E_BASE_URL: ""
          AIONIS_BASE_URL: ""
          AIONIS_URL: ""
          AIONIS_EXTERNAL_SMOKE_EMBEDDING_EXPECTATION: available
          AIONIS_EXTERNAL_SMOKE_EXPECTED_EMBEDDING_MODEL: dashscope:qwen3.7-text-embedding
          AIONIS_EXTERNAL_SMOKE_SDK_SPEC: ${{ steps.package-artifacts.outputs.sdk_spec }}
          AIONIS_EXTERNAL_SMOKE_MCP_SPEC: ${{ steps.package-artifacts.outputs.mcp_spec }}
          AIONIS_EXTERNAL_SMOKE_CREATE_SPEC: ${{ steps.package-artifacts.outputs.create_spec }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUNTIME_VERSION: ${{ steps.package-coordinates.outputs.runtime_version }}
          RELEASE_STATUS: ${{ steps.package-coordinates.outputs.release_status }}
        run: |
          set -euo pipefail
          test -n "${DASHSCOPE_API_KEY:-}"
          result_file="${RUNNER_TEMP}/aionis-exact-main-embedding-smoke.json"
          node --import tsx scripts/e2e/external-package-entrypoint-smoke.ts | tee "${result_file}"
          RESULT_FILE="${result_file}" node --input-type=module <<'NODE'
          import fs from "node:fs";

          const result = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, "utf8"));
          if (result.contract_version !== "aionis_external_package_entrypoint_smoke_v1") {
            throw new Error("unexpected external-package smoke contract");
          }
          if (result.runtime?.embedding_expectation !== "available") {
            throw new Error("external-package smoke did not use available embedding mode");
          }
          if (result.runtime?.expected_embedding_model !== "dashscope:qwen3.7-text-embedding") {
            throw new Error("external-package smoke used the wrong embedding model");
          }
          for (const key of [
            "create_cli_available",
            "mcp_cli_available",
            "sdk_product_loop_ok",
            "mcp_stdio_tool_loop_ok",
          ]) {
            if (result.checks?.[key] !== true) throw new Error(`external-package smoke failed ${key}`);
          }
          const summary = [
            "## Exact-main Qwen embedding smoke",
            "",
            `- Runtime: \`${process.env.RUNTIME_VERSION}\` at \`${process.env.EXPECTED_SHA}\``,
            `- Release train: \`${process.env.RELEASE_STATUS}\``,
            "- Environment: `exact-main-embedding`",
            "- Model: `dashscope:qwen3.7-text-embedding`",
            "- Dimensions: `1536`",
            "- SDK product loop: passed",
            "- MCP stdio tool loop: passed",
            "- Installer and MCP CLI entrypoints: passed",
            "",
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Verify immutable Runtime tag remains absent
        env:
          RUNTIME_TAG: ${{ steps.package-coordinates.outputs.runtime_tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RUNTIME_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release-train Runtime tag must be semantic vX.Y.Z" >&2
            exit 1
          fi
          tag_refs="$(git ls-remote --tags origin \
            "refs/tags/${RUNTIME_TAG}" "refs/tags/${RUNTIME_TAG}^{}")"
          test -z "${tag_refs}"
