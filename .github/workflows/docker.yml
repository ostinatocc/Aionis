name: Docker
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact immutable Runtime tag to verify and publish (for example v0.3.9)
        required: true
        type: string
      publish:
        description: Publish the verified digest to GHCR after every gate passes
        required: true
        default: false
        type: boolean
      recovery_run_id: { description: Failed tag-push run whose verified digest exists, required: false, default: "", type: string }
      recovery_run_attempt: { description: Exact failed attempt that verified the digest, required: false, default: "", type: string }
      recovery_digest: { description: Exact digest shared by build subject and release tag, required: false, default: "", type: string }
concurrency:
  group: docker-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: Verify exact release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AIONIS_SDK_REPO: ${{ github.workspace }}/external/aionis-sdk
      AIONIS_MANIFEST_REPO: ${{ github.workspace }}/external/AionisManifest
    outputs:
      release_status: ${{ steps.release-metadata.outputs.release_status }}
      publish_latest: ${{ steps.release-metadata.outputs.publish_latest }}
      runtime_tag: ${{ steps.release-metadata.outputs.runtime_tag }}
      runtime_commit: ${{ steps.release-metadata.outputs.runtime_commit }}
    steps:
      - name: Checkout Runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
          fetch-depth: 0
      - name: Verify release commit is on main first-parent history
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse 'HEAD^{commit}')"
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          if ! git rev-list --first-parent "${main_commit}" | \
            grep -F -x "${release_commit}" >/dev/null; then
            printf 'release commit %s is not on the origin/main first-parent history at %s\n' \
              "${release_commit}" "${main_commit}" >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify protected exact-main embedding evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse 'HEAD^{commit}')"
          evidence_file="${RUNNER_TEMP}/aionis-exact-main-embedding-runs.json"
          release_run_file="${RUNNER_TEMP}/aionis-docker-release-run.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/exact-main-embedding-smoke.yml/runs?event=workflow_dispatch&status=success&head_sha=${release_commit}&per_page=100" \
            > "${evidence_file}"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "${release_run_file}"
          EVIDENCE_FILE="${evidence_file}" RELEASE_RUN_FILE="${release_run_file}" \
            RELEASE_COMMIT="${release_commit}" \
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE, "utf8"));
          const commit = process.env.RELEASE_COMMIT;
          const train = JSON.parse(fs.readFileSync("release-train.json", "utf8"));
          const versionMatch = /^(\d+)\.(\d+)\.(\d+)$/.exec(String(train.runtime?.version ?? ""));
          if (!versionMatch) throw new Error("release-train Runtime version must be semantic x.y.z");
          const version = versionMatch.slice(1).map(Number);
          const minimum = [0, 3, 11];
          const firstDifference = version.findIndex((part, index) => part !== minimum[index]);
          const requiresEvidence = firstDifference === -1
            || version[firstDifference] > minimum[firstDifference];
          if (!requiresEvidence) {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `- Protected embedding evidence: not required for legacy Runtime v${train.runtime.version}\n`,
            );
            process.exit(0);
          }
          if (!["candidate", "stable"].includes(train.status)) {
            throw new Error(`protected embedding evidence requires candidate or stable status; got ${train.status}`);
          }
          const releaseRun = JSON.parse(fs.readFileSync(process.env.RELEASE_RUN_FILE, "utf8"));
          const releaseCreatedAt = Date.parse(String(releaseRun.created_at ?? ""));
          if (!Number.isFinite(releaseCreatedAt)) {
            throw new Error("Docker release run is missing its server-side created_at");
          }
          const runs = Array.isArray(payload.workflow_runs) ? payload.workflow_runs : [];
          const escapedCommit = commit.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const expectedTitle = new RegExp(
            `^Exact Main Embedding Smoke ${escapedCommit} ${train.status}-${escapedCommit}-\\d{8}T\\d{6}Z-[0-9a-f]{16}$`,
          );
          const evidence = runs.find((run) => (
            run?.path === ".github/workflows/exact-main-embedding-smoke.yml"
            && run?.event === "workflow_dispatch"
            && run?.status === "completed"
            && run?.conclusion === "success"
            && run?.head_branch === "main"
            && run?.head_sha === commit
            && expectedTitle.test(String(run?.display_title ?? ""))
            && Number.isFinite(Date.parse(String(run?.updated_at ?? "")))
            && Date.parse(String(run.updated_at)) <= releaseCreatedAt
          ));
          if (!evidence) {
            throw new Error(`no successful protected exact-main embedding evidence for ${commit}`);
          }
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `- Protected embedding evidence: [run ${evidence.id}](${evidence.html_url}) completed before this release run for \`${commit}\`\n`,
          );
          NODE
      - name: Read immutable package refs
        id: release-metadata
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const train = JSON.parse(fs.readFileSync("release-train.json", "utf8"));
            const output = process.env.GITHUB_OUTPUT;
            if (!["development", "candidate", "stable"].includes(train.status)) {
              throw new Error(`unsupported release-train status: ${train.status}`);
            }
            for (const key of ["cli", "create", "sdk", "manifest", "mcp", "aifs", "claude_code", "substrate"]) {
              fs.appendFileSync(output, `${key}_ref=${train.packages[key].source_ref}\n`);
            }
            fs.appendFileSync(output, `runtime_tag=${train.runtime.source_tag}\n`);
            fs.appendFileSync(output, `release_status=${train.status}\n`);
            fs.appendFileSync(output, `publish_latest=${train.status === "stable"}\n`);
          '
          echo "runtime_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Checkout CLI package
        uses: actions/checkout@v4
        with:
          repository: ostinatocc/aionis-cli
          ref: ${{ steps.release-metadata.outputs.cli_ref }}
          path: external/aionis-cli
      - name: Checkout installer package
        uses: actions/checkout@v4
        with:
          repository: ostinatocc/aionis-create
          ref: ${{ steps.release-metadata.outputs.create_ref }}
          path: external/aionis-create
      - name: Checkout standalone SDK
        uses: actions/checkout@v4
        with:
          repository: ostinatocc/aionis-sdk
          ref: ${{ steps.release-metadata.outputs.sdk_ref }}
          path: external/aionis-sdk
      - name: Checkout standalone Manifest
        uses: actions/checkout@v4
        with:
          repository: ostinatocc/AionisManifest
          ref: ${{ steps.release-metadata.outputs.manifest_ref }}
          path: external/AionisManifest
      - name: Checkout MCP package
        uses: actions/checkout@v4
        with:
          repository: ostinatocc/aionis-mcp
          ref: ${{ steps.release-metadata.outputs.mcp_ref }}
          path: external/aionis-mcp
      - name: Checkout AIFS package
        uses: actions/checkout@v4
        with:
          repository: ostinatocc/aionis-aifs
          ref: ${{ steps.release-metadata.outputs.aifs_ref }}
          path: external/aionis-aifs
      - name: Checkout Claude Code package
        uses: actions/checkout@v4
        with:
          repository: ostinatocc/aionis-claude-code
          ref: ${{ steps.release-metadata.outputs.claude_code_ref }}
          path: external/aionis-claude-code
      - name: Checkout Substrate package
        uses: actions/checkout@v4
        with:
          repository: ostinatocc/AionisSubstrate
          ref: ${{ steps.release-metadata.outputs.substrate_ref }}
          path: external/AionisSubstrate
      - name: Checkout dispatch verification harness
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: external/release-harness
          fetch-depth: 0
      - name: Verify dispatch harness commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_RUNTIME_COMMIT: ${{ steps.release-metadata.outputs.runtime_commit }}
        run: |
          set -euo pipefail
          actual_harness_commit="$(git -C external/release-harness rev-parse HEAD)"
          test "${actual_harness_commit}" = "${GITHUB_SHA}"
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              .github/workflows/docker.yml|.github/workflows/exact-main-embedding-smoke.yml|scripts/ci/release-workflow-contract.test.mjs|scripts/ci/docker-recovery-smoke.sh|scripts/e2e/external-package-entrypoint-smoke.ts|scripts/e2e/fresh-install-smoke.ts)
                ;;
              *)
                printf 'dispatch harness contains non-verification change: %s\n' "${changed_path}" >&2
                exit 1
                ;;
            esac
          done < <(git -C external/release-harness diff --name-only "${EXPECTED_RUNTIME_COMMIT}" "${actual_harness_commit}")
      - name: Install protected-close ACL verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl
      - name: Install dependencies
        run: npm ci
      - name: Verify release metadata and exact tag
        run: |
          set -euo pipefail
          actual_tag="$(git describe --tags --exact-match HEAD)"
          test "${actual_tag}" = "${AIONIS_RELEASE_EXPECTED_TAG}"
          node scripts/ci/release-artifact-gate.mjs \
            --check \
            --require-package-roots \
            --expect-tag "${AIONIS_RELEASE_EXPECTED_TAG}"
        env:
          AIONIS_RELEASE_EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
          AIONIS_RELEASE_CLI_REPO: ${{ github.workspace }}/external/aionis-cli
          AIONIS_RELEASE_CREATE_REPO: ${{ github.workspace }}/external/aionis-create
          AIONIS_RELEASE_SDK_REPO: ${{ github.workspace }}/external/aionis-sdk
          AIONIS_RELEASE_MANIFEST_REPO: ${{ github.workspace }}/external/AionisManifest
          AIONIS_RELEASE_MCP_REPO: ${{ github.workspace }}/external/aionis-mcp
          AIONIS_RELEASE_AIFS_REPO: ${{ github.workspace }}/external/aionis-aifs
          AIONIS_RELEASE_CLAUDE_CODE_REPO: ${{ github.workspace }}/external/aionis-claude-code
          AIONIS_RELEASE_SUBSTRATE_REPO: ${{ github.workspace }}/external/AionisSubstrate
      - name: Typecheck
        run: npm run -s typecheck
      - name: SDK and structural gates
        run: |
          npm run -s sdk:check
          npm run -s complexity:check
          node --test scripts/ci/release-version-docs.test.mjs
      - name: Verify standalone Manifest
        working-directory: external/AionisManifest
        run: |
          npm ci --ignore-scripts
          npm run -s verify
          npm pack --dry-run --ignore-scripts
      - name: Pack exact SDK, MCP, and installer artifacts
        id: package-artifacts
        env:
          PACK_DIR: ${{ runner.temp }}/aionis-release-packages
        run: |
          set -euo pipefail
          mkdir -p "${PACK_DIR}"
          pack_exact() {
            local output_name="$1"
            local package_dir="$2"
            (
              cd "${package_dir}"
              npm ci --ignore-scripts
            )
            local filename
            filename="$(
              cd "${package_dir}"
              AIONIS_RUNTIME_REPO="${GITHUB_WORKSPACE}" \
                npm pack --silent --pack-destination "${PACK_DIR}" | tail -n 1
            )"
            filename="$(basename "${filename}")"
            test -n "${filename}"
            test -f "${PACK_DIR}/${filename}"
            printf '%s_spec=%s/%s\n' "${output_name}" "${PACK_DIR}" "${filename}" >> "${GITHUB_OUTPUT}"
          }
          pack_exact sdk "${GITHUB_WORKSPACE}/external/aionis-sdk"
          pack_exact mcp "${GITHUB_WORKSPACE}/external/aionis-mcp"
          pack_exact create "${GITHUB_WORKSPACE}/external/aionis-create"
      - name: Static Lite test contracts
        run: npm run -s lite:test:static
      - name: Manifest product integration
        run: npm run -s lite:test:core:manifest
      - name: Lite public smoke
        run: |
          set -euo pipefail
          command -v setsid >/dev/null
          smoke_pid=""
          cleanup_smoke_group() {
            if [[ -z "${smoke_pid}" ]]; then
              return 0
            fi
            kill -TERM -- "-${smoke_pid}" >/dev/null 2>&1 || true
            for _ in $(seq 1 50); do
              if ! kill -0 -- "-${smoke_pid}" >/dev/null 2>&1; then
                smoke_pid=""
                return 0
              fi
              sleep 0.1
            done
            kill -KILL -- "-${smoke_pid}" >/dev/null 2>&1 || true
            for _ in $(seq 1 20); do
              if ! kill -0 -- "-${smoke_pid}" >/dev/null 2>&1; then
                smoke_pid=""
                return 0
              fi
              sleep 0.1
            done
            echo "Lite smoke process group ${smoke_pid} did not terminate" >&2
            return 1
          }
          trap 'cleanup_smoke_group || true' EXIT
          setsid npm run -s lite:smoke &
          smoke_pid=$!
          if wait "${smoke_pid}"; then
            smoke_status=0
          else
            smoke_status=$?
          fi
          cleanup_status=0
          cleanup_smoke_group || cleanup_status=$?
          trap - EXIT
          if [[ "${smoke_status}" -ne 0 ]]; then
            exit "${smoke_status}"
          fi
          exit "${cleanup_status}"
      - name: Cross-package Runtime, SDK, MCP, and installer smoke
        run: |
          set -euo pipefail
          runtime_tmp="$(mktemp -d)"
          runtime_log="${RUNNER_TEMP}/aionis-cross-package-runtime.log"
          PORT=3210 \
          AIONIS_LISTEN_HOST=127.0.0.1 \
          EMBEDDING_PROVIDER=none \
          LITE_WRITE_SQLITE_PATH="${runtime_tmp}/write.sqlite" \
          LITE_REPLAY_SQLITE_PATH="${runtime_tmp}/replay.sqlite" \
          node --import tsx src/index.ts >"${runtime_log}" 2>&1 &
          runtime_pid=$!
          cleanup() {
            kill -TERM "${runtime_pid}" >/dev/null 2>&1 || true
            wait "${runtime_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:3210/readyz >/dev/null; then break; fi
            if ! kill -0 "${runtime_pid}" >/dev/null 2>&1; then
              cat "${runtime_log}" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3210/readyz >/dev/null || {
            cat "${runtime_log}" >&2
            exit 1
          }
          AIONIS_BASE_URL=http://127.0.0.1:3210 \
          AIONIS_EXTERNAL_SMOKE_EMBEDDING_EXPECTATION=unavailable \
          AIONIS_EXTERNAL_SMOKE_SDK_SPEC="${{ steps.package-artifacts.outputs.sdk_spec }}" \
          AIONIS_EXTERNAL_SMOKE_MCP_SPEC="${{ steps.package-artifacts.outputs.mcp_spec }}" \
          AIONIS_EXTERNAL_SMOKE_CREATE_SPEC="${{ steps.package-artifacts.outputs.create_spec }}" \
          node --import tsx "${GITHUB_WORKSPACE}/${{ github.event_name == 'workflow_dispatch' && 'external/release-harness/scripts/e2e/external-package-entrypoint-smoke.ts' || 'scripts/e2e/external-package-entrypoint-smoke.ts' }}"
      - name: Fresh install from the exact Runtime tag
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          AIONIS_FRESH_INSTALL_CREATE_SPEC="${{ steps.package-artifacts.outputs.create_spec }}" \
          AIONIS_FRESH_INSTALL_MCP_SPEC="${{ steps.package-artifacts.outputs.mcp_spec }}" \
          AIONIS_FRESH_INSTALL_SDK_SPEC="${{ steps.package-artifacts.outputs.sdk_spec }}" \
          AIONIS_FRESH_INSTALL_REPO="https://github.com/${GITHUB_REPOSITORY}.git" \
          AIONIS_FRESH_INSTALL_RUNTIME_REF="${{ steps.release-metadata.outputs.runtime_tag }}" \
          AIONIS_FRESH_INSTALL_EXPECTED_RUNTIME_COMMIT="${{ steps.release-metadata.outputs.runtime_commit }}" \
          AIONIS_FRESH_INSTALL_VERIFIED_RUNTIME_SOURCE="${GITHUB_WORKSPACE}" \
          node --import tsx "${GITHUB_WORKSPACE}/${{ github.event_name == 'workflow_dispatch' && 'external/release-harness/scripts/e2e/fresh-install-smoke.ts' || 'scripts/e2e/fresh-install-smoke.ts' }}"
  release-core:
    name: Release core TypeScript (${{ matrix.shard }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - shard: bucket-0
            timeout_minutes: 40
          - shard: bucket-1
            timeout_minutes: 30
          - shard: bucket-2
            timeout_minutes: 40
          - shard: external-evidence
            timeout_minutes: 25
          - shard: deployment-authority
            timeout_minutes: 90
    steps:
      - name: Checkout verified Runtime release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.runtime_commit }}
      - name: Verify release core source commit
        env:
          EXPECTED_RUNTIME_COMMIT: ${{ needs.verify.outputs.runtime_commit }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse 'HEAD^{commit}')"
          test "${actual_commit}" = "${EXPECTED_RUNTIME_COMMIT}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install protected-close ACL verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl
      - name: Install dependencies
        run: npm ci
      - name: Run release core shard
        run: npm run -s lite:test:core:${{ matrix.shard }}
  release-recovery:
    name: Release provisioning recovery (${{ matrix.shard }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: bootstrap
            timeout_minutes: 35
          - shard: receipt
            timeout_minutes: 25
          - shard: durable
            timeout_minutes: 30
          - shard: terminal
            timeout_minutes: 25
    steps:
      - name: Checkout exact Runtime release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.runtime_commit }}
      - name: Verify release recovery source commit
        env:
          EXPECTED_RUNTIME_COMMIT: ${{ needs.verify.outputs.runtime_commit }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse 'HEAD^{commit}')"
          test "${actual_commit}" = "${EXPECTED_RUNTIME_COMMIT}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install protected-close ACL verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl
      - name: Install dependencies
        run: npm ci
      - name: Run release recovery shard
        run: npm run -s lite:test:recovery:${{ matrix.shard }}
  publish:
    name: Build once, verify digest, and publish Docker image
    needs: [verify, release-core, release-recovery]
    if: >-
      needs.verify.result == 'success' &&
      needs['release-core'].result == 'success' &&
      needs['release-recovery'].result == 'success' &&
      (needs.verify.outputs.release_status == 'candidate' ||
      needs.verify.outputs.release_status == 'stable') &&
      (github.event_name != 'workflow_dispatch' ||
      (inputs.recovery_run_id == '' && inputs.recovery_run_attempt == '' &&
      inputs.recovery_digest == '')) &&
      (github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/aionis
    steps:
      - name: Checkout exact Runtime release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.runtime_tag }}
      - name: Verify Docker source commit
        env:
          EXPECTED_RUNTIME_COMMIT: ${{ needs.verify.outputs.runtime_commit }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          test "${actual_commit}" = "${EXPECTED_RUNTIME_COMMIT}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.verify.outputs.runtime_tag }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.publish_latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ needs.verify.outputs.runtime_tag }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.runtime_commit }}
      - name: Define immutable provenance subject
        id: build-subject
        env:
          RUNTIME_TAG: ${{ needs.verify.outputs.runtime_tag }}
          RUNTIME_COMMIT: ${{ needs.verify.outputs.runtime_commit }}
        run: |
          set -euo pipefail
          subject_tag="build-${RUNTIME_TAG}-${RUNTIME_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! "${subject_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "invalid immutable build subject tag: ${subject_tag}" >&2
            exit 1
          fi
          echo "ref=${REGISTRY_IMAGE}:${subject_tag}" >> "${GITHUB_OUTPUT}"
      - name: Build immutable amd64 release artifact
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.build-subject.outputs.ref }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify immutable build subject digest
        env:
          BUILD_SUBJECT_REF: ${{ steps.build-subject.outputs.ref }}
          VERIFIED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          subject_digest=""
          for _ in $(seq 1 30); do
            subject_digest="$(docker buildx imagetools inspect "${BUILD_SUBJECT_REF}" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
            if [[ "${subject_digest}" == "${VERIFIED_DIGEST}" ]]; then
              break
            fi
            sleep 1
          done
          if [[ "${subject_digest}" != "${VERIFIED_DIGEST}" ]]; then
            echo "${BUILD_SUBJECT_REF} points to ${subject_digest}, expected ${VERIFIED_DIGEST}" >&2
            exit 1
          fi
      - name: Smoke the exact published digest
        env:
          VERIFIED_IMAGE_REF: ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}
        run: bash scripts/ci/docker-release-smoke.sh "${VERIFIED_IMAGE_REF}"
      - name: Recover the exact published digest across process death
        env:
          VERIFIED_IMAGE_REF: ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}
        run: bash scripts/ci/docker-recovery-smoke.sh "${VERIFIED_IMAGE_REF}"
      - name: Promote the verified digest to release tags
        env:
          VERIFIED_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ ! "${VERIFIED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "invalid verified image digest: ${VERIFIED_DIGEST}" >&2; exit 1; fi
          tag_args=()
          release_tags=()
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then tag_args+=(--tag "${tag}"); release_tags+=("${tag}"); fi
          done <<< "${RELEASE_TAGS}"
          if [[ ${#release_tags[@]} -eq 0 ]]; then echo "Docker metadata produced no release tags" >&2; exit 1; fi
          verified_image="${REGISTRY_IMAGE}@${VERIFIED_DIGEST}"
          for tag in "${release_tags[@]}"; do
            existing_digest="$(docker buildx imagetools inspect "${tag}" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
            if [[ -n "${existing_digest}" && "${existing_digest}" != "${VERIFIED_DIGEST}" ]]; then echo "refusing to replace existing ${tag} digest ${existing_digest} with ${VERIFIED_DIGEST}" >&2; exit 1; fi
          done
          docker buildx imagetools create "${tag_args[@]}" "${verified_image}"
          for tag in "${release_tags[@]}"; do
            promoted_digest=""
            for _ in $(seq 1 30); do
              promoted_digest="$(docker buildx imagetools inspect "${tag}" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
              if [[ -n "${promoted_digest}" && "${promoted_digest}" != "${VERIFIED_DIGEST}" ]]; then echo "${tag} points to conflicting ${promoted_digest}, expected ${VERIFIED_DIGEST}" >&2; exit 1; fi
              [[ "${promoted_digest}" == "${VERIFIED_DIGEST}" ]] && break
              sleep 1
            done
            if [[ "${promoted_digest}" != "${VERIFIED_DIGEST}" ]]; then echo "${tag} points to ${promoted_digest}, expected ${VERIFIED_DIGEST}" >&2; exit 1; fi
          done
  recover:
    name: Verify an existing promoted digest without registry writes
    needs: [verify, release-core, release-recovery]
    if: >-
      needs.verify.result == 'success' && needs['release-core'].result == 'success' && needs['release-recovery'].result == 'success' && (needs.verify.outputs.release_status == 'candidate' ||
      needs.verify.outputs.release_status == 'stable') && github.event_name == 'workflow_dispatch' &&
      (inputs.recovery_run_id != '' || inputs.recovery_run_attempt != '' || inputs.recovery_digest != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, actions: read, packages: read }
    env: { REGISTRY_IMAGE: "ghcr.io/${{ github.repository_owner }}/aionis" }
    steps:
      - { name: Checkout exact Runtime recovery source, uses: actions/checkout@v4, with: { ref: "${{ needs.verify.outputs.runtime_tag }}" } }
      - name: Verify recovery source commit
        env: { EXPECTED_RUNTIME_COMMIT: "${{ needs.verify.outputs.runtime_commit }}" }
        run: test "$(git rev-parse 'HEAD^{commit}')" = "${EXPECTED_RUNTIME_COMMIT}"
      - { name: Set up Node.js, uses: actions/setup-node@v4, with: { node-version: "24" } }
      - { name: Set up Docker Buildx, uses: docker/setup-buildx-action@v3 }
      - { name: Log in to GHCR read-only, uses: docker/login-action@v3, with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" } }
      - name: Bind failed source run evidence
        id: recovery
        env: { GH_TOKEN: "${{ github.token }}", PUBLISH_REQUESTED: "${{ inputs.publish }}", SOURCE_RUN_ID: "${{ inputs.recovery_run_id }}", SOURCE_RUN_ATTEMPT: "${{ inputs.recovery_run_attempt }}", EXPECTED_DIGEST: "${{ inputs.recovery_digest }}", RUNTIME_TAG: "${{ needs.verify.outputs.runtime_tag }}", RUNTIME_COMMIT: "${{ needs.verify.outputs.runtime_commit }}" }
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"; import { execFileSync } from "node:child_process";
          const need = (ok, message) => { if (!ok) throw new Error(message); }; const api = (path) => JSON.parse(execFileSync("gh", ["api", path], { encoding: "utf8" }));
          need(process.env.PUBLISH_REQUESTED === "true", "recovery requires explicit publish approval"); need(/^[1-9][0-9]*$/.test(process.env.SOURCE_RUN_ID) && /^[1-9][0-9]*$/.test(process.env.SOURCE_RUN_ATTEMPT), "recovery source run identity is invalid"); need(/^sha256:[0-9a-f]{64}$/.test(process.env.EXPECTED_DIGEST), "recovery digest is invalid");
          const base = `/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.SOURCE_RUN_ID}/attempts/${process.env.SOURCE_RUN_ATTEMPT}`;
          const run = api(base); const jobs = api(`${base}/jobs?per_page=100`).jobs ?? []; const current = api(`/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`);
          need(run.id === Number(process.env.SOURCE_RUN_ID) && run.run_attempt === Number(process.env.SOURCE_RUN_ATTEMPT), "recovery source run or attempt mismatch"); need(run.path === ".github/workflows/docker.yml" && run.event === "push" && run.status === "completed" && run.conclusion === "failure", "recovery source must be a completed failed tag-push Docker run"); need(run.head_sha === process.env.RUNTIME_COMMIT && run.head_branch === process.env.RUNTIME_TAG && Date.parse(run.updated_at) <= Date.parse(current.created_at), "recovery source tag, commit, or causal order mismatch");
          const matches = jobs.filter((job) => job.name === "Build once, verify digest, and publish Docker image"); const source = matches[0];
          need(matches.length === 1 && source.head_sha === process.env.RUNTIME_COMMIT && source.conclusion === "failure", "recovery source publish job mismatch"); need(jobs.every((job) => job === source || job.conclusion === "success"), "recovery source has another non-successful job");
          const steps = new Map(source.steps.map((step) => [step.name, step.conclusion]));
          for (const name of ["Verify Docker source commit", "Build immutable amd64 release artifact", "Verify immutable build subject digest", "Smoke the exact published digest", "Recover the exact published digest across process death"]) need(steps.get(name) === "success", `recovery source step was not successful: ${name}`);
          need(steps.get("Promote the verified digest to release tags") === "failure" && source.steps.filter((step) => step.conclusion === "failure").every((step) => step.name === "Promote the verified digest to release tags"), "recovery source must fail only at promotion verification");
          const subject = `${process.env.REGISTRY_IMAGE}:build-${process.env.RUNTIME_TAG}-${process.env.RUNTIME_COMMIT}-${process.env.SOURCE_RUN_ID}-${process.env.SOURCE_RUN_ATTEMPT}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `digest=${process.env.EXPECTED_DIGEST}\nsubject_ref=${subject}\n`);
          NODE
      - name: Verify tag, immutable subject, labels, and provenance
        env: { EXPECTED_DIGEST: "${{ steps.recovery.outputs.digest }}", SUBJECT_REF: "${{ steps.recovery.outputs.subject_ref }}", RUNTIME_TAG: "${{ needs.verify.outputs.runtime_tag }}", RUNTIME_COMMIT: "${{ needs.verify.outputs.runtime_commit }}", SOURCE_RUN_ID: "${{ inputs.recovery_run_id }}", SOURCE_RUN_ATTEMPT: "${{ inputs.recovery_run_attempt }}" }
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"; import { execFileSync } from "node:child_process"; import { setTimeout as delay } from "node:timers/promises";
          const need = (ok, message) => { if (!ok) throw new Error(message); };
          const inspect = (ref, format) => JSON.parse(execFileSync("docker", ["buildx", "imagetools", "inspect", "--format", format, ref], { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }));
          const digest = (ref) => { try { return inspect(ref, "{{json .Manifest.Digest}}"); } catch { return null; } };
          const release = `${process.env.REGISTRY_IMAGE}:${process.env.RUNTIME_TAG}`; let subjectDigest; let releaseDigest;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            subjectDigest = digest(process.env.SUBJECT_REF); releaseDigest = digest(release); for (const actual of [subjectDigest, releaseDigest]) need(actual === null || actual === process.env.EXPECTED_DIGEST, `recovery refuses conflicting digest ${actual}`);
            if (subjectDigest === process.env.EXPECTED_DIGEST && releaseDigest === process.env.EXPECTED_DIGEST) break;
            await delay(1_000);
          }
          need(subjectDigest === process.env.EXPECTED_DIGEST && releaseDigest === process.env.EXPECTED_DIGEST, "recovery digest was not stably readable");
          const image = inspect(release, "{{json .}}"); const provenance = inspect(release, "{{json .Provenance.SLSA}}"); const labels = image.image?.config?.Labels ?? {};
          need(image.manifest?.digest === process.env.EXPECTED_DIGEST && image.image?.architecture === "amd64" && image.image?.os === "linux", "release manifest or platform mismatch");
          need(labels["org.opencontainers.image.revision"] === process.env.RUNTIME_COMMIT && labels["org.opencontainers.image.version"] === process.env.RUNTIME_TAG, "release OCI labels mismatch");
          const objects = []; const visit = (value) => { if (!value || typeof value !== "object") return; objects.push(value); for (const child of Object.values(value)) visit(child); }; visit(provenance);
          const github = objects.find((value) => value.github_run_id === process.env.SOURCE_RUN_ID);
          need(github?.github_run_attempt === process.env.SOURCE_RUN_ATTEMPT && github?.github_repository === process.env.GITHUB_REPOSITORY, "provenance run binding mismatch"); need(github?.github_event_name === "push" && github?.github_job === "publish" && github?.github_ref === `refs/tags/${process.env.RUNTIME_TAG}`, "provenance tag workflow binding mismatch"); need(github?.github_workflow_ref === `${process.env.GITHUB_REPOSITORY}/.github/workflows/docker.yml@refs/tags/${process.env.RUNTIME_TAG}` && github?.github_workflow_sha === process.env.RUNTIME_COMMIT, "provenance workflow source mismatch");
          need(provenance.runDetails?.builder?.id === `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.SOURCE_RUN_ID}/attempts/${process.env.SOURCE_RUN_ATTEMPT}` && provenance.runDetails?.metadata?.buildkit_metadata?.vcs?.revision === process.env.RUNTIME_COMMIT, "provenance builder or VCS mismatch");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- Read-only recovery source: [run ${process.env.SOURCE_RUN_ID} attempt ${process.env.SOURCE_RUN_ATTEMPT}](https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.SOURCE_RUN_ID}/attempts/${process.env.SOURCE_RUN_ATTEMPT})\n- Immutable subject: \`${process.env.SUBJECT_REF}\`\n- Verified digest: \`${process.env.EXPECTED_DIGEST}\`\n- Registry writes: none\n`);
          NODE
      - name: Smoke the recovered exact digest
        env: { VERIFIED_IMAGE_REF: "${{ env.REGISTRY_IMAGE }}@${{ steps.recovery.outputs.digest }}" }
        run: bash scripts/ci/docker-release-smoke.sh "${VERIFIED_IMAGE_REF}"
      - name: Recover the exact digest again across process death
        env: { VERIFIED_IMAGE_REF: "${{ env.REGISTRY_IMAGE }}@${{ steps.recovery.outputs.digest }}" }
        run: bash scripts/ci/docker-recovery-smoke.sh "${VERIFIED_IMAGE_REF}"
