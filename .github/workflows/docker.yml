name: Docker
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact immutable Runtime tag to verify and publish (for example v0.3.9)
        required: true
        type: string
      publish:
        description: Publish the verified digest to GHCR after every gate passes
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: Verify exact release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AIONIS_SDK_REPO: ${{ github.workspace }}/external/aionis-sdk
      AIONIS_MANIFEST_REPO: ${{ github.workspace }}/external/AionisManifest
    outputs:
      release_status: ${{ steps.release-metadata.outputs.release_status }}
      runtime_tag: ${{ steps.release-metadata.outputs.runtime_tag }}
      runtime_commit: ${{ steps.release-metadata.outputs.runtime_commit }}
      stable_promotion_authorized: ${{ steps.release-gate.outputs.stable_promotion_authorized }}
      previous_latest_digest: ${{ steps.release-gate.outputs.previous_latest_digest }}
      previous_latest_version: ${{ steps.release-gate.outputs.previous_latest_version }}
      previous_latest_commit: ${{ steps.release-gate.outputs.previous_latest_commit }}
    steps:
      - name: Checkout Runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release and workflow commits are current protected main
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse 'HEAD^{commit}')"
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          if [[ "${GITHUB_REF}" != "refs/heads/main" || "${GITHUB_SHA}" != "${main_commit}" ]]; then
            printf 'Docker publication must be dispatched from current main %s, got %s at %s\n' \
              "${main_commit}" "${GITHUB_REF}" "${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ "${release_commit}" != "${main_commit}" ]]; then
            printf 'release commit %s is not current origin/main %s\n' \
              "${release_commit}" "${main_commit}" >&2
            exit 1
          fi
      - { name: Set up Node.js, uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020, with: { node-version: "24", cache: npm } } # v7.0.0
      - name: Verify protected exact-main embedding evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse 'HEAD^{commit}')"
          evidence_file="${RUNNER_TEMP}/aionis-exact-main-embedding-runs.json"
          release_run_file="${RUNNER_TEMP}/aionis-docker-release-run.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/exact-main-embedding-smoke.yml/runs?event=workflow_dispatch&status=success&head_sha=${release_commit}&per_page=100" \
            > "${evidence_file}"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "${release_run_file}"
          EVIDENCE_FILE="${evidence_file}" RELEASE_RUN_FILE="${release_run_file}" \
            RELEASE_COMMIT="${release_commit}" \
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE, "utf8"));
          const commit = process.env.RELEASE_COMMIT;
          const train = JSON.parse(fs.readFileSync("release-train.json", "utf8"));
          if (!["candidate", "stable"].includes(train.status)) {
            throw new Error(`protected embedding evidence requires candidate or stable status; got ${train.status}`);
          }
          const releaseRun = JSON.parse(fs.readFileSync(process.env.RELEASE_RUN_FILE, "utf8"));
          const releaseCreatedAt = Date.parse(String(releaseRun.created_at ?? ""));
          if (!Number.isFinite(releaseCreatedAt)) {
            throw new Error("Docker release run is missing its server-side created_at");
          }
          const runs = Array.isArray(payload.workflow_runs) ? payload.workflow_runs : [];
          const escapedCommit = commit.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const expectedTitle = new RegExp(
            `^Exact Main Embedding Smoke ${escapedCommit} ${train.status}-${escapedCommit}-\\d{8}T\\d{6}Z-[0-9a-f]{16}$`,
          );
          const evidence = runs.find((run) => (
            run?.path === ".github/workflows/exact-main-embedding-smoke.yml"
            && run?.event === "workflow_dispatch"
            && run?.status === "completed"
            && run?.conclusion === "success"
            && run?.head_branch === "main"
            && run?.head_sha === commit
            && expectedTitle.test(String(run?.display_title ?? ""))
            && Number.isFinite(Date.parse(String(run?.updated_at ?? "")))
            && Date.parse(String(run.updated_at)) <= releaseCreatedAt
          ));
          if (!evidence) {
            throw new Error(`no successful protected exact-main embedding evidence for ${commit}`);
          }
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `- Protected embedding evidence: [run ${evidence.id}](${evidence.html_url}) completed before this release run for \`${commit}\`\n`,
          );
          NODE
      - name: Read immutable package refs
        id: release-metadata
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const train = JSON.parse(fs.readFileSync("release-train.json", "utf8"));
            const output = process.env.GITHUB_OUTPUT;
            if (!["development", "candidate", "stable"].includes(train.status)) {
              throw new Error(`unsupported release-train status: ${train.status}`);
            }
            fs.appendFileSync(output, `create_version=${train.packages.create.version}\n`);
            fs.appendFileSync(output, `create_commit=${train.packages.create.source_commit}\n`);
            fs.appendFileSync(output, `runtime_tag=${train.runtime.source_tag}\n`);
            fs.appendFileSync(output, `release_status=${train.status}\n`);
          '
          echo "runtime_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Fetch sanitized stable workflow evidence
        if: steps.release-metadata.outputs.release_status == 'stable'
        env:
          EVALS_ACTIONS_READ_TOKEN: ${{ secrets.AIONIS_EVALS_ACTIONS_READ_TOKEN }}
          WORKFLOW_EVIDENCE: ${{ runner.temp }}/aionis-workflow-evidence.json
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const root = fs.realpathSync(".");
          const readBoundJson = (binding, label) => {
            const relative = binding?.path;
            if (!/^docs\/releases\/[0-9A-Za-z._-]+\.json$/.test(relative ?? "")) throw new Error(`${label} path is invalid`);
            let target = root;
            for (const component of relative.split("/")) {
              target = path.join(target, component);
              if (fs.lstatSync(target).isSymbolicLink()) throw new Error(`${label} path contains a symlink`);
            }
            if (!fs.lstatSync(target).isFile()) throw new Error(`${label} is not a regular file`);
            const raw = fs.readFileSync(target);
            const digest = createHash("sha256").update(raw).digest("hex");
            if (!/^[a-f0-9]{64}$/.test(binding.sha256 ?? "") || digest !== binding.sha256) throw new Error(`${label} hash mismatch`);
            return JSON.parse(raw);
          };
          const token = process.env.EVALS_ACTIONS_READ_TOKEN;
          if (!token) throw new Error("stable release requires AIONIS_EVALS_ACTIONS_READ_TOKEN");
          const train = JSON.parse(fs.readFileSync("release-train.json", "utf8"));
          const soak = readBoundJson(train.stable_promotion?.bounded_soak, "bounded soak receipt");
          const artifact = readBoundJson(soak.protocol?.artifact_bundle_manifest, "artifact manifest");
          const sources = [soak.pilot?.source_workflow, artifact.source_workflow, artifact.publisher_workflow];
          const phaseContracts = [
            ["pilot", "paid-preflight", "bounded-soak"],
            ["soak", "paid-preflight", "bounded-soak"],
            ["publisher", "evidence-publisher", "bounded-soak-publisher"],
          ];
          const pick = (value, keys) => Object.fromEntries(keys.map((key) => [key, value?.[key]]));
          const sourceKeys = ["repository", "run_id", "run_attempt", "head_sha", "phase", "job", "environment"];
          const runKeys = ["id", "run_attempt", "event", "status", "conclusion", "head_sha", "path", "created_at", "updated_at"];
          const jobKeys = ["id", "run_id", "run_attempt", "head_sha", "name", "status", "conclusion", "labels", "runner_id", "runner_group_name", "started_at", "completed_at"];
          if (!/^[a-f0-9]{40}$/.test(soak.harness?.commit ?? "") || artifact.harness_commit !== soak.harness.commit) throw new Error("soak harness commit is invalid");
          if (sourceKeys.some((key) => soak.execution?.source_workflow?.[key] !== artifact.source_workflow?.[key])) throw new Error("soak producer source drifted from the receipt");
          for (const [index, source] of sources.entries()) {
            const [phase, job, environment] = phaseContracts[index];
            const expected = { repository: "ostinatocc/AionisRuntime-evals", head_sha: soak.harness.commit, phase, job, environment };
            if (Object.keys(source ?? {}).sort().join() !== [...sourceKeys].sort().join()) throw new Error(`${phase} source keys are invalid`);
            for (const [key, value] of Object.entries(expected)) if (source[key] !== value) throw new Error(`${phase} source ${key} is invalid`);
            if (!Number.isInteger(source.run_id) || source.run_id < 1 || !Number.isInteger(source.run_attempt) || source.run_attempt < 1) throw new Error(`${phase} run identity is invalid`);
          }
          const identities = sources.map((source) => `${source.run_id}:${source.run_attempt}`);
          if (identities[0] === identities[1] || identities[1] !== identities[2]) throw new Error("pilot, soak, and publisher run identities are invalid");
          const releaseTags = new Set(artifact.entries.map((entry) => (
            new URL(entry.uri).pathname.split("/").filter(Boolean).at(-2)
          )));
          const releaseTag = [...releaseTags][0];
          if (releaseTags.size !== 1 || releaseTag !== `soak-${soak.candidate?.tag}-${soak.harness.commit}`) throw new Error("soak release tag is invalid");
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const api = async (url) => {
            const response = await fetch(`https://api.github.com${url}`, { headers, redirect: "error", signal: AbortSignal.timeout(120_000) });
            if (!response.ok) throw new Error(`GitHub workflow evidence fetch failed with HTTP ${response.status}`);
            return response.json();
          };
          const records = [];
          for (const source of sources) {
            const runId = encodeURIComponent(String(source.run_id));
            const attempt = encodeURIComponent(String(source.run_attempt));
            const base = `/repos/ostinatocc/AionisRuntime-evals/actions/runs/${runId}/attempts/${attempt}`;
            const [run, jobs] = await Promise.all([api(base), api(`${base}/jobs?per_page=100`)]);
            const name = source.phase === "publisher" ? "Protected evidence publisher" : `Protected ${source.phase} preflight`;
            const matches = jobs.jobs?.filter((job) => job.name === name) ?? [];
            if (matches.length !== 1) throw new Error(`expected exactly one ${name} job`);
            const job = matches[0];
            records.push({
              source: pick(source, sourceKeys),
              run: { ...pick(run, runKeys), repository: run.repository?.full_name },
              job: pick(job, jobKeys),
            });
          }
          const producer = artifact.source_workflow;
          const expectedArtifactNames = new Set(artifact.entries.map((entry) => (
            `soak-${entry.kind}-${artifact.harness_commit}-${producer.run_id}-${producer.run_attempt}-${entry.sha256}`
          )));
          const actionsResponse = await api(`/repos/ostinatocc/AionisRuntime-evals/actions/runs/${encodeURIComponent(String(producer.run_id))}/artifacts?per_page=100`);
          const artifacts = (actionsResponse.artifacts ?? [])
            .filter((entry) => expectedArtifactNames.has(entry.name))
            .map((entry) => ({
              ...pick(entry, ["id", "name", "size_in_bytes", "digest", "expired", "created_at", "updated_at", "expires_at"]),
              workflow_run_id: entry.workflow_run?.id,
              workflow_run_head_sha: entry.workflow_run?.head_sha,
            }));
          if (artifacts.length !== 6) throw new Error("expected exactly six run-owned Actions artifacts");
          const release = await api(`/repos/ostinatocc/AionisRuntime-evals/releases/tags/${encodeURIComponent(releaseTag)}`);
          if (release.assets?.length !== 6) throw new Error("expected exactly six soak release assets");
          const assets = release.assets.map((asset) => ({
            ...pick(asset, ["id", "name", "size", "digest", "state", "created_at", "updated_at"]),
            uploader: asset.uploader?.login,
            download_url: asset.browser_download_url,
          }));
          const releaseEvidence = {
            ...pick(release, ["id", "tag_name", "target_commitish", "draft", "prerelease", "immutable", "created_at", "published_at"]),
            author: release.author?.login,
          };
          fs.writeFileSync(process.env.WORKFLOW_EVIDENCE, `${JSON.stringify({
            schema_version: "aionis_workflow_run_evidence_v1",
            repository: "ostinatocc/AionisRuntime-evals",
            fetched_at: new Date().toISOString(),
            records,
            artifacts,
            assets,
            release: releaseEvidence,
          }, null, 2)}\n`, { mode: 0o600, flag: "wx" });
          NODE
      - name: Checkout exact packages and stable evaluation authority
        run: bash scripts/ci/release-package-artifacts.sh checkout release-train.json external
      - name: Install protected-close ACL verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl
      - name: Install dependencies
        run: npm ci
      - name: Verify release metadata and exact tag
        id: release-gate
        run: |
          set -euo pipefail
          actual_tag="$(git describe --tags --exact-match HEAD)"
          test "${actual_tag}" = "${AIONIS_RELEASE_EXPECTED_TAG}"
          gate_json="${RUNNER_TEMP}/aionis-release-gate.json"
          node scripts/ci/release-artifact-gate.mjs \
            --check \
            --require-package-roots \
            --expect-tag "${AIONIS_RELEASE_EXPECTED_TAG}" | tee "${gate_json}"
          GATE_JSON="${gate_json}" node --input-type=module <<'NODE'
          import fs from "node:fs";
          const gate = JSON.parse(fs.readFileSync(process.env.GATE_JSON, "utf8"));
          const previous = gate.promotion_authority?.expected_previous_latest;
          if (gate.status === "stable" && previous === undefined) {
            throw new Error("stable release gate returned no previous-latest authority");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `stable_promotion_authorized=${gate.status === "stable" && previous !== undefined}\n`);
          for (const key of ["digest", "version", "commit"]) fs.appendFileSync(process.env.GITHUB_OUTPUT, `previous_latest_${key}=${previous?.[key] ?? ""}\n`);
          NODE
        env:
          AIONIS_RELEASE_EXPECTED_TAG: ${{ inputs.release_ref }}
          AIONIS_RELEASE_CLI_REPO: ${{ github.workspace }}/external/aionis-cli
          AIONIS_RELEASE_CREATE_REPO: ${{ github.workspace }}/external/aionis-create
          AIONIS_RELEASE_SDK_REPO: ${{ github.workspace }}/external/aionis-sdk
          AIONIS_RELEASE_MANIFEST_REPO: ${{ github.workspace }}/external/AionisManifest
          AIONIS_RELEASE_MCP_REPO: ${{ github.workspace }}/external/aionis-mcp
          AIONIS_RELEASE_AIFS_REPO: ${{ github.workspace }}/external/aionis-aifs
          AIONIS_RELEASE_CLAUDE_CODE_REPO: ${{ github.workspace }}/external/aionis-claude-code
          AIONIS_RELEASE_SUBSTRATE_REPO: ${{ github.workspace }}/external/AionisSubstrate
          AIONIS_RELEASE_EVALUATION_REPO: ${{ steps.release-metadata.outputs.release_status == 'stable' && format('{0}/external/AionisRuntime-evals', github.workspace) || '' }}
          AIONIS_RELEASE_WORKFLOW_EVIDENCE: ${{ steps.release-metadata.outputs.release_status == 'stable' && format('{0}/aionis-workflow-evidence.json', runner.temp) || '' }}
      - name: Typecheck
        run: npm run -s typecheck
      - name: SDK and structural gates
        run: |
          npm run -s sdk:check
          npm run -s complexity:check
          node --test scripts/ci/release-version-docs.test.mjs
      - name: Verify standalone Manifest
        working-directory: external/AionisManifest
        run: |
          npm ci --ignore-scripts
          npm run -s verify
          npm pack --dry-run --ignore-scripts
      - name: Pack exact SDK, MCP, and installer artifacts
        id: package-artifacts
        env:
          PACK_DIR: ${{ runner.temp }}/aionis-release-packages
        run: |
          set -euo pipefail
          mkdir -p "${PACK_DIR}"
          pack_exact() {
            local output_name="$1"
            local package_dir="$2"
            (
              cd "${package_dir}"
              npm ci --ignore-scripts
            )
            local filename
            filename="$(
              cd "${package_dir}"
              AIONIS_RUNTIME_REPO="${GITHUB_WORKSPACE}" \
                npm pack --silent --pack-destination "${PACK_DIR}" | tail -n 1
            )"
            filename="$(basename "${filename}")"
            test -n "${filename}"
            test -f "${PACK_DIR}/${filename}"
            printf '%s_spec=%s/%s\n' "${output_name}" "${PACK_DIR}" "${filename}" >> "${GITHUB_OUTPUT}"
          }
          pack_exact sdk "${GITHUB_WORKSPACE}/external/aionis-sdk"
          pack_exact mcp "${GITHUB_WORKSPACE}/external/aionis-mcp"
          pack_exact create "${GITHUB_WORKSPACE}/external/aionis-create"
      - name: Static Lite test contracts
        run: npm run -s lite:test:static
      - name: Manifest product integration
        run: npm run -s lite:test:core:manifest
      - name: Lite public smoke
        run: npm run -s lite:smoke
      - name: Cross-package Runtime, SDK, MCP, and installer smoke
        run: |
          set -euo pipefail
          runtime_tmp="$(mktemp -d)"
          runtime_log="${RUNNER_TEMP}/aionis-cross-package-runtime.log"
          PORT=3210 \
          AIONIS_LISTEN_HOST=127.0.0.1 \
          EMBEDDING_PROVIDER=none \
          LITE_WRITE_SQLITE_PATH="${runtime_tmp}/write.sqlite" \
          LITE_REPLAY_SQLITE_PATH="${runtime_tmp}/replay.sqlite" \
          node --import tsx src/index.ts >"${runtime_log}" 2>&1 &
          runtime_pid=$!
          cleanup() {
            kill -TERM "${runtime_pid}" >/dev/null 2>&1 || true
            wait "${runtime_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:3210/readyz >/dev/null; then break; fi
            if ! kill -0 "${runtime_pid}" >/dev/null 2>&1; then
              cat "${runtime_log}" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3210/readyz >/dev/null || {
            cat "${runtime_log}" >&2
            exit 1
          }
          AIONIS_BASE_URL=http://127.0.0.1:3210 \
          AIONIS_EXTERNAL_SMOKE_EMBEDDING_EXPECTATION=unavailable \
          AIONIS_EXTERNAL_SMOKE_SDK_SPEC="${{ steps.package-artifacts.outputs.sdk_spec }}" \
          AIONIS_EXTERNAL_SMOKE_MCP_SPEC="${{ steps.package-artifacts.outputs.mcp_spec }}" \
          AIONIS_EXTERNAL_SMOKE_CREATE_SPEC="${{ steps.package-artifacts.outputs.create_spec }}" \
          node --import tsx "${GITHUB_WORKSPACE}/scripts/e2e/external-package-entrypoint-smoke.ts"
      - name: Fresh install through the declared installer authority
        env:
          LOCAL_CREATE_SPEC: ${{ steps.package-artifacts.outputs.create_spec }}
          CREATE_VERSION: ${{ steps.release-metadata.outputs.create_version }}
          CREATE_COMMIT: ${{ steps.release-metadata.outputs.create_commit }}
          MCP_SPEC: ${{ steps.package-artifacts.outputs.mcp_spec }}
          SDK_SPEC: ${{ steps.package-artifacts.outputs.sdk_spec }}
          RELEASE_STATUS: ${{ steps.release-metadata.outputs.release_status }}
          RUNTIME_TAG: ${{ steps.release-metadata.outputs.runtime_tag }}
          RUNTIME_COMMIT: ${{ steps.release-metadata.outputs.runtime_commit }}
        run: |
          set -euo pipefail
          harness="${GITHUB_WORKSPACE}/scripts/e2e/fresh-install-smoke.ts"
          common=(
            "AIONIS_FRESH_INSTALL_MCP_SPEC=${MCP_SPEC}"
            "AIONIS_FRESH_INSTALL_SDK_SPEC=${SDK_SPEC}"
            "AIONIS_FRESH_INSTALL_EXPECTED_RUNTIME_COMMIT=${RUNTIME_COMMIT}"
          )
          if [[ "${RELEASE_STATUS}" == "stable" ]]; then
            public_create_spec="@aionis/create@${CREATE_VERSION}"
            bash scripts/ci/release-package-artifacts.sh verify-published-create \
              "${public_create_spec}" "${CREATE_VERSION}" "${CREATE_COMMIT}" "${LOCAL_CREATE_SPEC}"
            env "${common[@]}" \
              "AIONIS_FRESH_INSTALL_CREATE_SPEC=${public_create_spec}" \
              node --import tsx "${harness}"
          else
            env "${common[@]}" \
              "AIONIS_FRESH_INSTALL_CREATE_SPEC=${LOCAL_CREATE_SPEC}" \
              "AIONIS_FRESH_INSTALL_RUNTIME_REF=${RUNTIME_TAG}" \
              "AIONIS_FRESH_INSTALL_VERIFIED_RUNTIME_SOURCE=${GITHUB_WORKSPACE}" \
              node --import tsx "${harness}"
          fi
  release-tests:
    name: Release ${{ matrix.suite }} (${{ matrix.shard }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - { suite: core, shard: bucket-0, timeout_minutes: 40 }
          - { suite: core, shard: bucket-1, timeout_minutes: 30 }
          - { suite: core, shard: bucket-2, timeout_minutes: 40 }
          - { suite: core, shard: external-evidence, timeout_minutes: 25 }
          - { suite: core, shard: deployment-authority, timeout_minutes: 90 }
          - { suite: recovery, shard: bootstrap, timeout_minutes: 35 }
          - { suite: recovery, shard: receipt, timeout_minutes: 25 }
          - { suite: recovery, shard: durable, timeout_minutes: 30 }
          - { suite: recovery, shard: terminal, timeout_minutes: 25 }
    steps:
      - name: Checkout exact Runtime release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.runtime_commit }}
          persist-credentials: false
      - name: Verify release-test source commit
        env:
          EXPECTED_RUNTIME_COMMIT: ${{ needs.verify.outputs.runtime_commit }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse 'HEAD^{commit}')"
          test "${actual_commit}" = "${EXPECTED_RUNTIME_COMMIT}"
      - { name: Set up Node.js, uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020, with: { node-version: "24", cache: npm } } # v7.0.0
      - name: Install protected-close ACL verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl
      - name: Install dependencies
        run: npm ci
      - name: Run release-test shard
        run: npm run -s lite:test:${{ matrix.suite }}:${{ matrix.shard }}
  publish:
    name: Build once, verify digest, and publish Docker image
    needs: [verify, release-tests]
    if: >-
      needs.verify.result == 'success' &&
      needs['release-tests'].result == 'success' &&
      (needs.verify.outputs.release_status == 'candidate' ||
      needs.verify.outputs.release_status == 'stable') &&
      github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: ${{ needs.verify.outputs.release_status == 'stable' && 'stable-release' || 'candidate-release' }}
    concurrency:
      group: ghcr-aionis-publisher
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      verified_digest: ${{ steps.promote.outputs.verified_digest }}
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/aionis
    steps:
      - { name: Checkout exact Runtime release source, uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1, with: { ref: "${{ needs.verify.outputs.runtime_tag }}", persist-credentials: false } } # v7.0.1
      - name: Verify Docker source commit
        env:
          EXPECTED_RUNTIME_COMMIT: ${{ needs.verify.outputs.runtime_commit }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          test "${actual_commit}" = "${EXPECTED_RUNTIME_COMMIT}"
      - { name: Set up Docker Buildx, uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c } # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define OCI release metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.verify.outputs.runtime_tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.verify.outputs.runtime_tag }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.runtime_commit }}
      - name: Define immutable provenance subject
        id: build-subject
        env:
          RUNTIME_TAG: ${{ needs.verify.outputs.runtime_tag }}
          RUNTIME_COMMIT: ${{ needs.verify.outputs.runtime_commit }}
        run: |
          set -euo pipefail
          subject_tag="build-${RUNTIME_TAG}-${RUNTIME_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! "${subject_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "invalid immutable build subject tag: ${subject_tag}" >&2
            exit 1
          fi
          echo "ref=${REGISTRY_IMAGE}:${subject_tag}" >> "${GITHUB_OUTPUT}"
      - name: Build immutable amd64 release artifact
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.build-subject.outputs.ref }}
          push: true
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify immutable build subject digest
        env:
          BUILD_SUBJECT_REF: ${{ steps.build-subject.outputs.ref }}
          VERIFIED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          subject_digest=""
          for _ in $(seq 1 30); do
            subject_digest="$(docker buildx imagetools inspect "${BUILD_SUBJECT_REF}" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
            if [[ "${subject_digest}" == "${VERIFIED_DIGEST}" ]]; then
              break
            fi
            sleep 1
          done
          if [[ "${subject_digest}" != "${VERIFIED_DIGEST}" ]]; then
            echo "${BUILD_SUBJECT_REF} points to ${subject_digest}, expected ${VERIFIED_DIGEST}" >&2
            exit 1
          fi
      - name: Recover the exact published digest across process death
        env:
          VERIFIED_IMAGE_REF: ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}
        run: bash scripts/ci/docker-recovery-smoke.sh "${VERIFIED_IMAGE_REF}"
      - name: Upgrade v0.3.6 data through the exact digest
        env:
          VERIFIED_IMAGE_REF: ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}
          EXPECTED_RUNTIME_COMMIT: ${{ needs.verify.outputs.runtime_commit }}
          EXPECTED_RUNTIME_TAG: ${{ needs.verify.outputs.runtime_tag }}
        run: >-
          bash scripts/ci/docker-recovery-smoke.sh --cross-version
          "${VERIFIED_IMAGE_REF}" "${EXPECTED_RUNTIME_COMMIT}" "${EXPECTED_RUNTIME_TAG}"
      - name: Promote and verify the immutable version tag
        id: promote
        env:
          VERIFIED_DIGEST: ${{ steps.build.outputs.digest }}
          RUNTIME_TAG: ${{ needs.verify.outputs.runtime_tag }}
        run: |
          set -euo pipefail
          if [[ ! "${VERIFIED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "invalid verified image digest: ${VERIFIED_DIGEST}" >&2; exit 1; fi
          version_ref="${REGISTRY_IMAGE}:${RUNTIME_TAG}"
          inspect_error="$(mktemp)"
          if inspect_output="$(docker buildx imagetools inspect "${version_ref}" 2>"${inspect_error}")"; then
            existing_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"${inspect_output}")"
            if [[ ! "${existing_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "${version_ref} returned an invalid digest" >&2; exit 1; fi
          elif grep -Fqx "ERROR: ${version_ref}: not found" "${inspect_error}" ||
            grep -Fqx "ERROR: ${version_ref}: manifest unknown" "${inspect_error}"; then
            existing_digest=""
          else
            cat "${inspect_error}" >&2
            echo "failed to inspect immutable ${version_ref}" >&2
            exit 1
          fi
          if [[ -n "${existing_digest}" && "${existing_digest}" != "${VERIFIED_DIGEST}" ]]; then echo "refusing to replace existing ${version_ref} digest ${existing_digest} with ${VERIFIED_DIGEST}" >&2; exit 1; fi
          verified_image="${REGISTRY_IMAGE}@${VERIFIED_DIGEST}"
          [[ "${existing_digest}" == "${VERIFIED_DIGEST}" ]] || docker buildx imagetools create --tag "${version_ref}" "${verified_image}"
          promoted_digest=""
          for _ in $(seq 1 30); do
            promoted_digest="$(docker buildx imagetools inspect "${version_ref}" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
            if [[ -n "${promoted_digest}" && "${promoted_digest}" != "${VERIFIED_DIGEST}" ]]; then echo "${version_ref} points to conflicting ${promoted_digest}, expected ${VERIFIED_DIGEST}" >&2; exit 1; fi
            [[ "${promoted_digest}" == "${VERIFIED_DIGEST}" ]] && break
            sleep 1
          done
          if [[ "${promoted_digest}" != "${VERIFIED_DIGEST}" ]]; then echo "${version_ref} points to ${promoted_digest}, expected ${VERIFIED_DIGEST}" >&2; exit 1; fi
          echo "verified_digest=${VERIFIED_DIGEST}" >> "${GITHUB_OUTPUT}"
      - name: Promote latest only from the expected stable predecessor
        if: needs.verify.outputs.release_status == 'stable'
        env:
          AUTHORIZED: ${{ needs.verify.outputs.stable_promotion_authorized }}
          TARGET_DIGEST: ${{ steps.promote.outputs.verified_digest }}
          RUNTIME_TAG: ${{ needs.verify.outputs.runtime_tag }}
          RUNTIME_COMMIT: ${{ needs.verify.outputs.runtime_commit }}
          PREVIOUS_DIGEST: ${{ needs.verify.outputs.previous_latest_digest }}
          PREVIOUS_VERSION: ${{ needs.verify.outputs.previous_latest_version }}
          PREVIOUS_COMMIT: ${{ needs.verify.outputs.previous_latest_commit }}
        run: |
          set -euo pipefail
          [[ "${AUTHORIZED}" == "true" ]] || { echo "stable latest promotion authority is missing" >&2; exit 1; }
          for digest in "${TARGET_DIGEST}" "${PREVIOUS_DIGEST}"; do [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid promotion digest: ${digest}" >&2; exit 1; }; done
          [[ "${RUNTIME_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "${PREVIOUS_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "${PREVIOUS_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid stable version lineage" >&2; exit 1; }
          version_ref="${REGISTRY_IMAGE}:${RUNTIME_TAG}"; previous_ref="${REGISTRY_IMAGE}:${PREVIOUS_VERSION}"; latest_ref="${REGISTRY_IMAGE}:latest"
          version_json="$(docker buildx imagetools inspect --format '{{json .}}' "${version_ref}")"
          previous_json="$(docker buildx imagetools inspect --format '{{json .}}' "${previous_ref}")"
          VERSION_JSON="${version_json}" PREVIOUS_JSON="${previous_json}" node --input-type=module <<'NODE'
          const need = (ok, message) => { if (!ok) throw new Error(message); };
          const target = JSON.parse(process.env.VERSION_JSON);
          const previous = JSON.parse(process.env.PREVIOUS_JSON);
          const labels = (image) => image.image?.config?.Labels ?? {};
          const assertOciIdentity = (image, digest, version, revision, field) => {
            const values = labels(image);
            need(image.manifest?.digest === digest, `${field} digest mismatch`);
            need(values["org.opencontainers.image.version"] === version, `${field} version label mismatch`);
            need(values["org.opencontainers.image.revision"] === revision, `${field} revision label mismatch`);
            need(values["org.opencontainers.image.source"] === `https://github.com/${process.env.GITHUB_REPOSITORY}`, `${field} source label mismatch`);
            need(values["org.opencontainers.image.url"] === `https://github.com/${process.env.GITHUB_REPOSITORY}`, `${field} URL label mismatch`);
            need(values["org.opencontainers.image.title"] === "Aionis", `${field} title label mismatch`);
            need(values["org.opencontainers.image.licenses"] === "Apache-2.0", `${field} license label mismatch`);
            need(Number.isFinite(Date.parse(values["org.opencontainers.image.created"])), `${field} created label mismatch`);
            need(typeof values["org.opencontainers.image.description"] === "string" && values["org.opencontainers.image.description"].length > 0, `${field} description label mismatch`);
          };
          assertOciIdentity(target, process.env.TARGET_DIGEST, process.env.RUNTIME_TAG, process.env.RUNTIME_COMMIT, "stable version tag");
          assertOciIdentity(previous, process.env.PREVIOUS_DIGEST, process.env.PREVIOUS_VERSION, process.env.PREVIOUS_COMMIT, "previous latest version tag");
          const parts = (tag) => tag.slice(1).split(".").map(Number);
          const [next, prior] = [parts(process.env.RUNTIME_TAG), parts(process.env.PREVIOUS_VERSION)];
          need(next.some((part, index) => part !== prior[index] && part > prior[index] && next.slice(0, index).every((value, earlier) => value === prior[earlier])), "stable latest version must advance monotonically");
          NODE
          current_digest="$(docker buildx imagetools inspect "${latest_ref}" | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "${current_digest}" == "${TARGET_DIGEST}" ]] && exit 0
          [[ "${current_digest}" == "${PREVIOUS_DIGEST}" ]] || { echo "${latest_ref} moved to unexpected ${current_digest}" >&2; exit 1; }
          prewrite_digest="$(docker buildx imagetools inspect "${latest_ref}" | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "${prewrite_digest}" == "${PREVIOUS_DIGEST}" ]] || { echo "${latest_ref} changed before promotion to ${prewrite_digest}" >&2; exit 1; }
          docker buildx imagetools create --tag "${latest_ref}" "${REGISTRY_IMAGE}@${TARGET_DIGEST}"
          for _ in $(seq 1 30); do
            promoted_digest="$(docker buildx imagetools inspect "${latest_ref}" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
            [[ "${promoted_digest}" == "${TARGET_DIGEST}" ]] && exit 0
            [[ -z "${promoted_digest}" || "${promoted_digest}" == "${PREVIOUS_DIGEST}" ]] || { echo "${latest_ref} points to conflicting ${promoted_digest}" >&2; exit 1; }
            sleep 1
          done
          echo "${latest_ref} did not converge to ${TARGET_DIGEST}" >&2; exit 1
