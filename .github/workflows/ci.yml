name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "Standalone @aionis/sdk ref used by ownership checks"
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIONIS_SDK_REPO: ${{ github.workspace }}/external/aionis-sdk
      AIONIS_MANIFEST_REPO: ${{ github.workspace }}/external/AionisManifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install protected-close ACL verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl

      - name: Resolve standalone SDK ref
        id: sdk-ref
        env:
          SDK_REF_OVERRIDE: ${{ inputs.sdk_ref }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const requiredString = (value, field) => {
              const normalized = typeof value === "string" ? value.trim() : "";
              if (!normalized) throw new Error(`${field} must be a non-empty string`);
              return normalized;
            };
            const dependencies = JSON.parse(fs.readFileSync("ci-dependencies.json", "utf8"));
            const releaseTrain = JSON.parse(fs.readFileSync("release-train.json", "utf8"));
            if (dependencies.schema_version !== "aionis_ci_dependency_lock_v1") {
              throw new Error("unsupported ci-dependencies.json schema_version");
            }
            const repository = requiredString(dependencies.sdk?.repository, "ci-dependencies.sdk.repository");
            const contractCommit = requiredString(
              dependencies.sdk?.contract_commit,
              "ci-dependencies.sdk.contract_commit",
            );
            if (!/^[a-f0-9]{40}$/i.test(contractCommit)) {
              throw new Error("ci-dependencies.sdk.contract_commit must be a 40-character commit");
            }
            const releaseRef = requiredString(
              releaseTrain.packages?.sdk?.source_ref,
              "release-train.packages.sdk.source_ref",
            );
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `repository=${repository}\n`);
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `contract_ref=${process.env.SDK_REF_OVERRIDE || contractCommit}\n`,
            );
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_ref=${releaseRef}\n`);
          '

      - name: Checkout standalone SDK contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.sdk-ref.outputs.repository }}
          ref: ${{ steps.sdk-ref.outputs.contract_ref }}
          path: external/aionis-sdk

      - name: Checkout frozen SDK release artifact
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.sdk-ref.outputs.repository }}
          ref: ${{ steps.sdk-ref.outputs.release_ref }}
          path: external/release/aionis-sdk

      - name: Resolve standalone Manifest ref
        id: manifest-ref
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const releaseTrain = JSON.parse(fs.readFileSync("release-train.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `ref=${releaseTrain.packages.manifest.source_ref}\n`);
          '

      - name: Checkout standalone Manifest
        uses: actions/checkout@v4
        with:
          repository: ostinatocc/AionisManifest
          ref: ${{ steps.manifest-ref.outputs.ref }}
          path: external/AionisManifest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run -s typecheck

      - name: Release artifact gate
        run: node scripts/ci/release-artifact-gate.mjs --check
        env:
          AIONIS_RELEASE_SDK_REPO: ${{ github.workspace }}/external/release/aionis-sdk
          AIONIS_RELEASE_MANIFEST_REPO: ${{ github.workspace }}/external/AionisManifest

      - name: Verify standalone Manifest
        working-directory: external/AionisManifest
        run: |
          npm ci --ignore-scripts
          npm run -s verify
          npm pack --dry-run --ignore-scripts

      - name: Release docs version check
        run: node --test scripts/ci/release-version-docs.test.mjs

      - name: Standalone SDK contract check
        run: npm run -s sdk:check

      - name: Runtime complexity gate
        run: npm run -s complexity:check

      - name: Static contract tests
        run: npm run -s lite:test:static

      - name: Manifest product integration
        run: npm run -s lite:test:core:manifest

      - name: Lite public smoke
        run: npm run -s lite:smoke

  runtime-core:
    name: Core TypeScript (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - shard: bucket-0
            timeout_minutes: 40
          - shard: bucket-1
            timeout_minutes: 30
          - shard: bucket-2
            timeout_minutes: 40
          - shard: external-evidence
            timeout_minutes: 25
          - shard: deployment-authority
            timeout_minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install protected-close ACL verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl

      - name: Install dependencies
        run: npm ci

      - name: Run core shard
        run: npm run -s lite:test:core:${{ matrix.shard }}

  runtime-recovery:
    name: Provisioning recovery (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: bootstrap
            timeout_minutes: 35
          - shard: receipt
            timeout_minutes: 25
          - shard: durable
            timeout_minutes: 30
          - shard: terminal
            timeout_minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install protected-close ACL verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl

      - name: Install dependencies
        run: npm ci

      - name: Run recovery shard
        run: npm run -s lite:test:recovery:${{ matrix.shard }}

  minimum-node:
    name: Node 22.15 minimum compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up minimum supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
          cache: npm

      - name: Install protected-close ACL verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run -s typecheck

      - name: Provisioning journal compatibility
        run: node --import tsx --test scripts/ci/lite-runtime-deployment-slot-provisioning-journal-integrity.test.ts

      - name: Lite public smoke
        run: npm run -s lite:smoke

  sandbox-shutdown-macos:
    name: Sandbox shutdown (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify real sandbox shutdown
        run: node --import tsx --test scripts/ci/lite-runtime-security-shutdown.test.ts

  required:
    name: Required CI gates
    if: always()
    needs: [runtime, runtime-core, runtime-recovery, minimum-node, sandbox-shutdown-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Runtime gate
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          CORE_RESULT: ${{ needs['runtime-core'].result }}
          RECOVERY_RESULT: ${{ needs['runtime-recovery'].result }}
          MINIMUM_NODE_RESULT: ${{ needs.minimum-node.result }}
          SANDBOX_SHUTDOWN_MACOS_RESULT: ${{ needs.sandbox-shutdown-macos.result }}
        run: |
          test "$RUNTIME_RESULT" = success
          test "$CORE_RESULT" = success
          test "$RECOVERY_RESULT" = success
          test "$MINIMUM_NODE_RESULT" = success
          test "$SANDBOX_SHUTDOWN_MACOS_RESULT" = success
