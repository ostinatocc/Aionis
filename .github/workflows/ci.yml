name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "Standalone @aionis/sdk ref used by ownership checks"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIONIS_SDK_REPO: ${{ github.workspace }}/external/aionis-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout standalone SDK contracts
        uses: actions/checkout@v4
        with:
          repository: ostinatocc/aionis-sdk
          ref: ${{ inputs.sdk_ref || 'main' }}
          path: external/aionis-sdk

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run -s typecheck

      - name: Release docs version check
        run: node --test scripts/ci/release-version-docs.test.mjs

      - name: Lite test suite
        run: npm run -s lite:test
